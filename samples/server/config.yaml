globalDelay: 0.0
variantOverrides:
  "GET /public/health": "success"
auth:
  # bearerTokens validates endpoints with `auth: type: bearer, verify: true`.
  # The same token doubles as the OAuth2 access token issued by POST /_auth/token.
  bearerTokens:
    - "sample-oauth-token"
  oauth2Tokens:
    - "sample-oauth-token"
  oauth2Clients:
    - clientId: "sample-client"
      clientSecret: "sample-secret"
  oauth2TokenScopes:
    sample-oauth-token:
      - "read:pets"
overridesPersistencePath: "./samples/server/runtime/overrides.json"
admin:
  bearerToken: "admin-token"
