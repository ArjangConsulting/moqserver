openapi: "3.0.3"
info:
  title: moqserver Mobile Showcase API
  version: "1.0.0"
components:
  securitySchemes:
    oauth2Auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: "/_auth/token"
          scopes:
            read:pets: "Read pets"
paths:
  /public/health:
    get:
      summary: Health check endpoint
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              example:
                status: "ok"
                service: "moqserver"

  /pets:
    get:
      summary: List pets
      responses:
        "200":
          description: Pet list
          content:
            application/json:
              example:
                - id: 1
                  name: "Fido"
                - id: 2
                  name: "Whiskers"
        "500":
          description: Server error
          content:
            application/json:
              example:
                error: "Internal server error"

  /pets/favorites:
    get:
      summary: Favorites endpoint protected by OAuth2
      security:
        - oauth2Auth:
            - "read:pets"
      responses:
        "200":
          description: Favorite pets
          content:
            application/json:
              example:
                - id: 1
                  name: "Fido"
                - id: 3
                  name: "Buddy"
