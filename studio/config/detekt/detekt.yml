# Detekt configuration for moqserver Studio
# https://detekt.dev/docs/rules/overview

complexity:
  CognitiveComplexMethod:
    active: true
    threshold: 15
  CyclomaticComplexMethod:
    threshold: 15
  LargeClass:
    threshold: 400
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter: ['Composable']
  NestedBlockDepth:
    threshold: 5
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignorePrivate: true

style:
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
    excludeRawStrings: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.coroutines.*'
      - 'androidx.compose.foundation.*'
      - 'androidx.compose.foundation.layout.*'
      - 'androidx.compose.material3.*'
      - 'androidx.compose.material.icons.*'
      - 'androidx.compose.material.icons.filled.*'
      - 'androidx.compose.material.icons.outlined.*'
      - 'androidx.compose.runtime.*'
      - 'androidx.compose.ui.*'
      - 'androidx.compose.ui.unit.*'
      - 'com.moqserver.studio.projectformat.*'
      - 'com.moqserver.studio.ui.*'
      - 'kotlinx.serialization.json.*'
  ReturnCount:
    max: 4
    excludeGuardClauses: true
    excludeReturnFromLambda: true
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  DataClassShouldBeImmutable:
    active: true

naming:
  FunctionNaming:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/desktopTest/**']
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '[_a-z][A-Za-z0-9]*'

formatting:
  Indentation:
    indentSize: 4
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
  MaximumLineLength:
    active: true
    maxLineLength: 140

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'IndexOutOfBoundsException'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
