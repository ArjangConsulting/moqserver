# SLF4J SimpleLogger configuration for moqserver studio
# Docs: https://www.slf4j.org/api/org/slf4j/simple/SimpleLogger.html

# Write to stdout (crash log already captures errors separately)
org.slf4j.simpleLogger.logFile=System.out

# Default level: info. Override per-package by setting:
#   org.slf4j.simpleLogger.log.com.moqserver.studio=debug
org.slf4j.simpleLogger.defaultLogLevel=info

# Timestamp format
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS

# Use short class names to keep output readable
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showLogName=true

# Include level in brackets: [INFO], [WARN], etc.
org.slf4j.simpleLogger.levelInBrackets=true

# Thread name adds noise for a single-threaded UI app; omit it
org.slf4j.simpleLogger.showThreadName=false

# Suppress noisy third-party libraries
org.slf4j.simpleLogger.log.io.swagger=warn
org.slf4j.simpleLogger.log.io.ktor=warn
org.slf4j.simpleLogger.log.org.snakeyaml=warn
