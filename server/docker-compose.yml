services:
  moqserver:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./spec:/app/spec:ro
      - ./mocks:/app/mocks:ro
      - ./config:/app/config:ro
    command:
      - serve
      - --spec
      - /app/spec/openapi.yaml
      - --hostname
      - "0.0.0.0"
      - --port
      - "8080"
      - --mocks
      - /app/mocks
      - --config
      - /app/config/config.yaml
