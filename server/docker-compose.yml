services:
  moqserver:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Point this at the .moqproj bundle you want to serve.
      - ./Tests/MoqFormatTests/Fixtures/sample-app.moqproj:/app/project.moqproj:ro
      - ./config:/app/config:ro
    command:
      - serve
      - --project
      - /app/project.moqproj
      - --hostname
      - "0.0.0.0"
      - --port
      - "8080"
      - --config
      - /app/config/config.yaml
