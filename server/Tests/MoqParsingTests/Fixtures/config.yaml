variantOverrides:
  "GET /pets": "error-500"
globalDelay: 0.0
delayOverrides:
  "POST /pets": 0.0
auth:
  bearerTokens:
    - "test-token"
  basicCredentials:
    - username: "admin"
      password: "pass"
  apiKeys:
    X-API-Key: "my-key"
  oauth2Tokens:
    - "mock-oauth-token"
  oauth2Clients:
    - clientId: "test-client"
      clientSecret: "test-secret"
mocksDirectory: "./mocks"
