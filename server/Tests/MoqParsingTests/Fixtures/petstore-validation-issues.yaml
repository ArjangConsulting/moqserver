openapi: "3.0.3"
info:
  title: Petstore Validation Issues
  version: "1.0.0"
paths:
  /pets:
    get:
      summary: List all pets (no operationId, schema but no example)
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet (only error response, no 2xx)
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "404":
          description: Pet not found
          content:
            application/json:
              example:
                error: "Pet not found"
  /deprecated:
    get:
      operationId: deprecatedEndpoint
      deprecated: true
      summary: A deprecated endpoint
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                status: "ok"
  /empty-response:
    get:
      operationId: emptyResponse
      summary: GET with no response content
      responses:
        "200":
          description: Success with no content body
  /no-schema-no-example:
    get:
      operationId: noSchemaNoExample
      summary: Response with content type declared but neither schema nor example
      responses:
        "200":
          description: Mystery content
          content:
            application/json: {}
