openapi: "3.0.3"
info:
  title: Petstore with Auth
  version: "1.0.0"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    oauth2Auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: "/_auth/token"
          scopes:
            read:pets: "Read pets"
            write:pets: "Write pets"
        authorizationCode:
          authorizationUrl: "/_auth/authorize"
          tokenUrl: "/_auth/token"
          scopes:
            read:pets: "Read pets"
            write:pets: "Write pets"
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      summary: List all pets (uses global bearer auth)
      operationId: listPets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              example:
                - id: 1
                  name: "Fido"
  /pets/{petId}:
    get:
      summary: Get a pet (basic auth override)
      operationId: getPetById
      security:
        - basicAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single pet
          content:
            application/json:
              example:
                id: 1
                name: "Fido"
  /public/health:
    get:
      summary: Health check (no auth)
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                status: "ok"
  /pets/favorites:
    get:
      summary: List favorite pets (OAuth2 with scopes)
      operationId: listFavorites
      security:
        - oauth2Auth:
            - "read:pets"
      responses:
        "200":
          description: Favorite pets
          content:
            application/json:
              example:
                - id: 1
                  name: "Fido"
    post:
      summary: Add a favorite pet (OAuth2 with write scope)
      operationId: addFavorite
      security:
        - oauth2Auth:
            - "read:pets"
            - "write:pets"
      responses:
        "201":
          description: Pet added to favorites
          content:
            application/json:
              example:
                id: 1
                name: "Fido"
