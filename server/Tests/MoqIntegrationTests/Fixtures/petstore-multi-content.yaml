openapi: "3.0.3"
info:
  title: Petstore Multi-Content
  version: "1.0.0"
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
              example:
                - id: 1
                  name: "Fido"
            application/xml:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
            text/plain:
              schema:
                type: string
  /pets/{petId}:
    get:
      summary: Get a pet by ID
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single pet
          content:
            application/json:
              example:
                id: 1
                name: "Fido"
            application/xml:
              example:
                id: 1
                name: "Fido"
            text/html:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
        "404":
          description: Pet not found
          content:
            application/json:
              example:
                error: "Pet not found"
  /pets/{petId}/photo:
    get:
      summary: Get pet photo
      operationId: getPetPhoto
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pet photo
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
  /report:
    get:
      summary: Get report
      operationId: getReport
      responses:
        "200":
          description: Report in various formats
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
