openapi: "3.0.3"
info:
  title: Petstore
  version: "1.0.0"
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
              example:
                - id: 1
                  name: "Fido"
                - id: 2
                  name: "Whiskers"
        "500":
          description: Server error
          content:
            application/json:
              example:
                error: "Internal server error"
    post:
      summary: Create a pet
      operationId: createPet
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              example:
                id: 3
                name: "Buddy"
  /pets/{petId}:
    get:
      summary: Get a pet by ID
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single pet
          content:
            application/json:
              example:
                id: 1
                name: "Fido"
        "404":
          description: Pet not found
          content:
            application/json:
              example:
                error: "Pet not found"
