version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: swift
    directory: /server
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: gradle
    directory: /studio
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: gradle
    directory: /samples/android
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: gradle
    directory: /clients/kotlin
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
