name: Server

on:
  pull_request:
    paths:
      - ".github/workflows/server.yml"
      - "server/**"
      - "format/**"
      - "samples/server/**"
      - "Makefile"
      - "scripts/test_author_cli.py"
      - "scripts/test_support_consumer.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/server.yml"
      - "server/**"
      - "format/**"
      - "samples/server/**"
      - "Makefile"
      - "scripts/test_author_cli.py"
      - "scripts/test_support_consumer.py"

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"
          skip-verify-signature: true

      - name: Lint (swift-format)
        run: swift-format lint --strict --recursive --configuration .swift-format Sources Tests Package.swift

  test:
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"
          skip-verify-signature: true

      - name: Build server
        run: swift build

      - name: Run server tests
        run: swift test --enable-code-coverage

      - name: Verify author CLI as a subprocess
        run: python3 ../scripts/test_author_cli.py .build/debug/moq-author

      - name: Test Apple test-support package and downstream consumer
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          swift test --package-path MoqTestSupport
          python3 ../scripts/test_support_consumer.py

      - name: Upload Server coverage
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-coverage
          path: server/.build/debug/codecov/moqserver.json
          if-no-files-found: error
