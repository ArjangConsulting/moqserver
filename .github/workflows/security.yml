name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # continue-on-error: the GitHub dependency graph is not yet enabled for
      # this repository, which makes dependency-review-action fail outright
      # ("Dependency review is not supported on this repository"). Don't let
      # that block CI; remove continue-on-error once the dependency graph is
      # enabled in repo settings.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        continue-on-error: true
        with:
          fail-on-severity: high

  codeql:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      ORG_GRADLE_PROJECT_useLocalCompositeBuilds: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out code editor
        if: ${{ vars.CODE_EDITOR_PUBLISHED != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 28790a500c93efc717acf03ab475f988e236087d
          path: .ci/kmp-code-editor
          persist-credentials: false

      - name: Select editor dependency
        working-directory: ${{ github.workspace }}
        env:
          CODE_EDITOR_PUBLISHED: ${{ vars.CODE_EDITOR_PUBLISHED }}
        run: |
          if [ "$CODE_EDITOR_PUBLISHED" = "true" ]; then
            bash studio/scripts/verify-published-editor.sh
          else
            echo "ORG_GRADLE_PROJECT_codeEditorCompositeBuild=$GITHUB_WORKSPACE/.ci/kmp-code-editor" >> "$GITHUB_ENV"
          fi
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: java-kotlin,swift
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic
      - name: Build analyzed products
        run: |
          swift build --package-path server
          studio/gradlew -p studio :composeApp:compileKotlinDesktop
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
