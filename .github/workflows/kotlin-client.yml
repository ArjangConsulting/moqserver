name: Kotlin client

on:
  pull_request:
    paths:
      - ".github/workflows/kotlin-client.yml"
      - "clients/kotlin/**"
      - "jitpack.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kotlin-client.yml"
      - "clients/kotlin/**"
      - "jitpack.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/kotlin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Test
        run: ./gradlew test

      - name: Publish to Maven local (what JitPack runs)
        run: ./gradlew publishToMavenLocal
