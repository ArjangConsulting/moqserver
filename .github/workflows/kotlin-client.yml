name: Kotlin client

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kotlin-client.yml"
      - "clients/kotlin/**"
      - "jitpack.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: clients/kotlin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Temurin 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Test
        run: ./gradlew test

      - name: Publish to Maven local (what JitPack runs)
        run: ./gradlew publishToMavenLocal
