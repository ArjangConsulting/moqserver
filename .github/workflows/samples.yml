name: Mobile Samples

on:
  pull_request:
    paths:
      - ".github/workflows/samples.yml"
      - "samples/android/**"
      - "samples/ios/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/samples.yml"
      - "samples/android/**"
      - "samples/ios/**"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.7.1"
      - name: Build Android debug sample
        working-directory: samples/android
        run: gradle :app:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build iOS simulator sample
        run: >-
          xcodebuild -project samples/ios/MoqServerShowcase.xcodeproj
          -scheme MoqServerShowcase
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
