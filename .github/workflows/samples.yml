name: Mobile Samples

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/samples.yml"
      - "samples/android/**"
      - "samples/ios/**"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: "9.7.1"
      - name: Build Android debug sample
        working-directory: samples/android
        run: gradle :app:assembleDebug

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build iOS simulator sample
        run: >-
          xcodebuild -project samples/ios/MoqServerShowcase.xcodeproj
          -scheme MoqServerShowcase
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
