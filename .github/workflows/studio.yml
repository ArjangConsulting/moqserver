name: Studio

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/studio.yml"
      - "studio/**"
      - "format/**"
      - "server/**"

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_useLocalCompositeBuilds: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out code editor
        if: ${{ vars.CODE_EDITOR_PUBLISHED != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 28790a500c93efc717acf03ab475f988e236087d
          path: .ci/kmp-code-editor
          persist-credentials: false

      - name: Select editor dependency
        working-directory: ${{ github.workspace }}
        env:
          CODE_EDITOR_PUBLISHED: ${{ vars.CODE_EDITOR_PUBLISHED }}
        run: |
          if [ "$CODE_EDITOR_PUBLISHED" = "true" ]; then
            bash studio/scripts/verify-published-editor.sh
          else
            echo "ORG_GRADLE_PROJECT_codeEditorCompositeBuild=$GITHUB_WORKSPACE/.ci/kmp-code-editor" >> "$GITHUB_ENV"
          fi

      - name: Set up Temurin 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Lint (detekt)
        run: ./gradlew detektAll

  test:
    needs: lint

    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out code editor
        if: ${{ vars.CODE_EDITOR_PUBLISHED != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 28790a500c93efc717acf03ab475f988e236087d
          path: .ci/kmp-code-editor
          persist-credentials: false

      - name: Select editor dependency
        working-directory: ${{ github.workspace }}
        env:
          CODE_EDITOR_PUBLISHED: ${{ vars.CODE_EDITOR_PUBLISHED }}
        run: |
          if [ "$CODE_EDITOR_PUBLISHED" = "true" ]; then
            bash studio/scripts/verify-published-editor.sh
          else
            echo "ORG_GRADLE_PROJECT_codeEditorCompositeBuild=$GITHUB_WORKSPACE/.ci/kmp-code-editor" >> "$GITHUB_ENV"
          fi

      - name: Set up Swift
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true

      # Studio's integration tests (FormatClientIntegrationTest, ProjectRepositoryTest,
      # RemoteHARImportTest, RemoteOpenAPIImportTest, ...) spawn the real moq-format binary and
      # talk JSON-RPC to it over stdio rather than mocking the wire protocol; without a binary at
      # MOQSERVER_FORMAT_BINARY they skip (not fail), which would otherwise let this whole class
      # of test silently stop running in CI.
      - name: Build moq-format
        working-directory: server
        run: |
          swift build -c release --product moq-format
          echo "MOQSERVER_FORMAT_BINARY=$(swift build -c release --show-bin-path)/moq-format" >> "$GITHUB_ENV"

      - name: Set up Temurin 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # `test` alone only runs pure-JVM modules; studio-domain and studio-project-format are KMP
      # modules whose jvmTest needs `allTests`, and composeApp's Compose Desktop tests need their
      # own `desktopTest` task — neither is pulled in by `test` alone.
      - name: Run Studio tests
        run: xvfb-run --auto-servernum ./gradlew test allTests desktopTest koverXmlReport koverVerify

      - name: Upload Studio coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: studio-coverage
          path: studio/build/reports/kover/report.xml
          if-no-files-found: error

  package-macos:
    needs: lint

    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out code editor
        if: ${{ vars.CODE_EDITOR_PUBLISHED != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 28790a500c93efc717acf03ab475f988e236087d
          path: .ci/kmp-code-editor
          persist-credentials: false

      - name: Select editor dependency
        working-directory: ${{ github.workspace }}
        env:
          CODE_EDITOR_PUBLISHED: ${{ vars.CODE_EDITOR_PUBLISHED }}
        run: |
          if [ "$CODE_EDITOR_PUBLISHED" = "true" ]; then
            bash studio/scripts/verify-published-editor.sh
          else
            echo "ORG_GRADLE_PROJECT_codeEditorCompositeBuild=$GITHUB_WORKSPACE/.ci/kmp-code-editor" >> "$GITHUB_ENV"
          fi

      - name: Set up Temurin 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      # Validates the native macOS packaging path (app image) without signing.
      - name: Build distributable app image
        run: ./gradlew :composeApp:createDistributable
