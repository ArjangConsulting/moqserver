name: Studio

on:
  pull_request:
    paths:
      - ".github/workflows/studio.yml"
      - "studio/**"
      - "format/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/studio.yml"
      - "studio/**"
      - "format/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Lint (detekt)
        run: ./gradlew detektAll

  test:
    needs: lint

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Studio tests
        run: xvfb-run --auto-servernum ./gradlew test koverXmlReport koverVerify :composeApp:compileKotlinDesktop

      - name: Upload Studio coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: studio-coverage
          path: studio/build/reports/kover/report.xml
          if-no-files-found: error

  package-macos:
    needs: lint

    runs-on: macos-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      # Validates the native macOS packaging path (app image) without signing.
      - name: Build distributable app image
        run: ./gradlew :composeApp:createDistributable
