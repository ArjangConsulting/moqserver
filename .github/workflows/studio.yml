name: Studio

on:
  pull_request:
    paths:
      - ".github/workflows/studio.yml"
      - "studio/**"
      - "format/**"
      - "server/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/studio.yml"
      - "studio/**"
      - "format/**"
      - "server/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Lint (detekt)
        run: ./gradlew detektAll

  test:
    needs: lint

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"
          skip-verify-signature: true

      # Studio's integration tests (FormatClientIntegrationTest, ProjectRepositoryTest,
      # RemoteHARImportTest, RemoteOpenAPIImportTest, ...) spawn the real moq-format binary and
      # talk JSON-RPC to it over stdio rather than mocking the wire protocol; without a binary at
      # MOQSERVER_FORMAT_BINARY they skip (not fail), which would otherwise let this whole class
      # of test silently stop running in CI.
      - name: Build moq-format
        working-directory: server
        run: |
          swift build -c release --product moq-format
          echo "MOQSERVER_FORMAT_BINARY=$(swift build -c release --show-bin-path)/moq-format" >> "$GITHUB_ENV"

      - name: Set up Temurin 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # `test` alone only runs pure-JVM modules; studio-domain and studio-project-format are KMP
      # modules whose jvmTest needs `allTests`, and composeApp's Compose Desktop tests need their
      # own `desktopTest` task — neither is pulled in by `test` alone.
      - name: Run Studio tests
        run: xvfb-run --auto-servernum ./gradlew test allTests desktopTest koverXmlReport koverVerify

      - name: Upload Studio coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: studio-coverage
          path: studio/build/reports/kover/report.xml
          if-no-files-found: error

  package-macos:
    needs: lint

    runs-on: macos-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      # Validates the native macOS packaging path (app image) without signing.
      - name: Build distributable app image
        run: ./gradlew :composeApp:createDistributable
